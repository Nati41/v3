<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טופס PDF - שולחני בלבד</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Heebo', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at top, #f8fafc 0%, #e2e8f0 60%, #cbd5e1 100%);
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 36px 28px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.15);
            border: 1px solid rgba(148, 163, 184, 0.25);
        }

        .title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 1rem;
            line-height: 1.7;
            color: #475569;
            margin-bottom: 24px;
        }

        .cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            border-radius: 999px;
            background: #0f172a;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
        }

        .hint {
            margin-top: 14px;
            font-size: 0.9rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">היי!</div>
        <div class="subtitle">
            tofesPDF עדיין לא זמין בנייד. כדי לשמור על חוויית מילוי מדויקת ונוחה, הכלי פועל כרגע במחשב בלבד.
        </div>
        <div class="hint">פתח את האתר במחשב ונמשיך משם.</div>
    </div>
</body>
</html>
