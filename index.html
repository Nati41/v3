<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tofesly - מערכת מילוי טפסים</title>
    <link rel="stylesheet" href="assets/css/app.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font-primary);
            background: var(--bg-primary, #f7f8fa);
            display: flex;
            flex-direction: column;
        }

        /* ===== Top Bar - Compact Style ===== */
        #topbar {
            height: 40px;
            background: var(--primary-gradient, linear-gradient(135deg, #667eea 0%, #764ba2 100%));
            display: flex;
            align-items: center;
            padding: 0 16px;
            box-shadow: var(--shadow-md);
            z-index: 1000;
            gap: 16px;
        }

        /* Logo */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            background: rgba(255,255,255,0.2);
            border-radius: var(--radius-sm, 6px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .logo h1 {
            color: var(--text-inverse, white);
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        /* Mode Switch - Pill Style */
        .mode-switch {
            display: flex;
            background: rgba(255,255,255,0.12);
            border-radius: var(--radius-lg, 12px);
            padding: 4px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .mode-switch button {
            padding: 6px 14px;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.75);
            font-size: 13px;
            font-weight: 500;
            font-family: var(--font-primary);
            cursor: pointer;
            border-radius: var(--radius-sm, 6px);
            transition: all var(--transition-normal, 0.2s);
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }

        .mode-switch button:hover {
            color: white;
            background: rgba(255,255,255,0.08);
        }

        .mode-switch button.active {
            background: var(--bg-secondary, white);
            color: var(--primary-color, #667eea);
            box-shadow: var(--shadow-md);
            font-weight: 600;
        }

        .mode-switch button .icon {
            font-size: 14px;
        }

        /* Spacer */
        .spacer {
            flex: 1;
        }

        /* Help Link */
        .help-link {
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: var(--radius-sm, 6px);
            transition: all var(--transition-fast, 0.15s);
        }

        .help-link:hover {
            color: white;
            background: rgba(255,255,255,0.1);
        }

        /* ===== Tool Container ===== */
        #tool-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--bg-primary, #f7f8fa);
        }

        #tool-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: var(--bg-secondary, white);
            display: none;
        }

        #tool-container iframe.active {
            display: block;
        }

        /* ===== Version Badge ===== */
        .version-badge {
            position: fixed;
            bottom: 12px;
            left: 12px;
            font-size: 11px;
            color: var(--text-muted, #9ca3af);
            background: var(--bg-secondary, white);
            padding: 6px 10px;
            border-radius: var(--radius-md, 8px);
            box-shadow: var(--shadow-sm);
            z-index: 100;
            border: 1px solid var(--border-light, #e5e7eb);
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            #topbar {
                padding: 0 16px;
                gap: 12px;
            }

            .logo h1 {
                font-size: 18px;
            }

            .mode-switch button {
                padding: 8px 14px;
                font-size: 13px;
            }

            .mode-switch button span:last-child {
                display: none;
            }

            .help-link span {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Top Bar -->
    <div id="topbar">
        <!-- Logo -->
        <div class="logo">
            <div class="logo-icon">📋</div>
            <h1>Tofesly</h1>
        </div>

        <!-- Mode Switch -->
        <div class="mode-switch">
            <button id="btn-mapper" class="mode-btn active" data-mode="mapping">
                <span class="icon">📐</span>
                <span>כלי מיפוי</span>
            </button>
            <button id="btn-livefill" class="mode-btn" data-mode="filling">
                <span class="icon">✍️</span>
                <span>כלי מילוי</span>
            </button>
        </div>

        <!-- Spacer -->
        <div class="spacer"></div>

        <!-- Help -->
        <a href="#" class="help-link" title="עזרה">
            <span>❓</span>
            <span>עזרה</span>
        </a>
    </div>

    <!-- Tool Container - iframes (NO cross-iframe communication) -->
    <div id="tool-container">
        <iframe id="mapper-frame" class="active" src="src/mapper/mapper.html" title="Mapper Tool"></iframe>
        <iframe id="livefill-frame" src="src/livefill/livefill.html" title="LiveFill Tool"></iframe>
    </div>

    <!-- Version Badge -->
    <div class="version-badge">Tofesly v2.0</div>

    <!-- App Shell Script (NO iframe communication) -->
    <script src="assets/js/app-shell.js"></script>
</body>
</html>
