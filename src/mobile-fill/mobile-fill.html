<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MobileFill</title>
    <link rel="stylesheet" href="css/mobile-fill.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc =
                'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.0.0"></script>
    <script>
        if (window.PDFLib && window.fontkit) {
            PDFLib.PDFDocument.prototype.registerFontkit = function(fontkitInstance) {
                this.fontkit = fontkitInstance;
            };
            PDFLib.PDFDocument.registerFontkit = function(fontkitInstance) {
                PDFLib.PDFDocument.prototype.fontkit = fontkitInstance;
            };
            PDFLib.PDFDocument.registerFontkit(fontkit);
        }
    </script>
</head>
<body>
    <!-- Rotate overlay for portrait mode -->
    <div id="mobilefill-rotate-overlay" role="status" aria-live="polite">
        <div class="rotate-content">
            <div class="rotate-icon">📱</div>
            <div class="rotate-text">סובב למצב אופקי</div>
        </div>
    </div>

    <main id="mobilefill-root">
        <!-- Screen 1: Form Selector -->
        <div id="mobilefill-form-selector" class="mobilefill-screen">
            <div class="mobilefill-screen-header">
                <h1>בחר טופס למילוי</h1>
            </div>
            <div id="mobilefill-form-list" class="mobilefill-form-list">
                <!-- Forms loaded dynamically -->
                <div class="mobilefill-loading">טוען טפסים...</div>
            </div>
        </div>

        <!-- Screen 2: Upload (fallback if no catalog) -->
        <div id="mobilefill-upload-overlay" class="is-hidden">
            <div class="mobilefill-upload-card">
                <div class="mobilefill-upload-title">העלה PDF למילוי</div>
                <label class="mobilefill-upload-button">
                    בחר קובץ PDF
                    <input id="mobilefill-pdf-input" type="file" accept="application/pdf">
                </label>
            </div>
        </div>

        <!-- Screen 3: PDF Viewer + Fill -->
        <div id="mobilefill-fill-screen" class="mobilefill-screen is-hidden">
            <div id="mobilefill-pdf-container"></div>
        </div>

        <!-- Status bar (debug) -->
        <pre id="mobilefill-status" class="is-hidden">MobileFill</pre>
    </main>

    <!-- Navigation bar (prev/next field) -->
    <div id="mobilefill-nav-bar" class="is-hidden">
        <button id="mobilefill-prev-field" type="button" class="nav-btn">
            <span class="nav-arrow">→</span>
            <span class="nav-label">קודם</span>
        </button>
        <div id="mobilefill-field-counter" class="nav-counter">0 / 0</div>
        <button id="mobilefill-next-field" type="button" class="nav-btn">
            <span class="nav-label">הבא</span>
            <span class="nav-arrow">←</span>
        </button>
    </div>

    <!-- Export bar -->
    <div id="mobilefill-export-bar" class="is-hidden">
        <button id="mobilefill-export-button" type="button">הורד טופס מלא</button>
    </div>

    <!-- Scripts -->
    <script src="js/event-bus.js"></script>
    <script src="js/state-store.js"></script>
    <!-- Shared dependencies -->
    <script src="../shared/normalizeField.js"></script>
    <script src="../shared/migrateV1toV2.js"></script>
    <script src="../shared/UnifiedCoordinateSystem.js"></script>
    <script src="../livefill/js/preview-text-renderer.js"></script>
    <script src="../livefill/js/export-engine.js"></script>
    <!-- Mobile-fill modules -->
    <script src="js/mobile-debug-console.js"></script>
    <script src="js/event-logger.js"></script>
    <script src="js/form-catalog-service.js"></script>
    <script src="js/form-selector-screen.js"></script>
    <script src="js/mapping-loader.js"></script>
    <script src="js/pdf-upload.js"></script>
    <script src="js/pdf-loader.js"></script>
    <script src="js/mobile-pdf-viewer.js"></script>
    <script src="js/hotspot-overlay.js"></script>
    <script src="js/field-navigator.js"></script>
    <!-- quickfill-editor.js removed - MobileFill is view/fill only, not for creating new fields -->
    <script src="js/ui-status.js"></script>
    <script src="js/landscape-gate.js"></script>
    <script src="js/export-button.js"></script>
    <script src="js/live-preview-renderer.js"></script>
    <script src="js/export-controller.js"></script>
    <script src="js/mobile-flow-controller.js"></script>
    <script src="js/bootstrap.js"></script>
</body>
</html>
