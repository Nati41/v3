<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapper V3 - Field Mapping Tool</title>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- Tesseract.js for OCR fallback -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="styles/mapper-v3.css">
    <!-- V3.9: Welcome screens styles -->
    <link rel="stylesheet" href="styles/welcome-screens.css">

    <!-- V3.10: David Libre Font - CRITICAL for Quick Fill text anchoring (same as Export) -->
    <style>
        @font-face {
            font-family: 'David Libre';
            src: url('/assets/fonts/DavidLibre/DavidLibre-Regular.ttf') format('truetype'),
                 url('./fonts/DavidLibre-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>Loading Mapper V3...</p>
        </div>
    </div>

    <!-- V3.9: Welcome Screen Container (shown first) -->
    <div id="welcome-screen-container" style="display: none;"></div>

    <!-- V3.9: Field Loader Screen Container -->
    <div id="field-loader-screen-container" style="display: none;"></div>

    <!-- Main Container -->
    <div id="mapper-container" class="mapper-container">
        <!-- Header / Toolbar -->
        <header id="toolbar" class="toolbar">
            <div class="toolbar-group">
                <button id="btn-open-pdf" class="toolbar-btn" title="Open PDF">
                    <span class="icon">📄</span>
                    <span class="label">Open PDF</span>
                </button>
                <button id="btn-import-json" class="toolbar-btn" title="Import JSON">
                    <span class="icon">📥</span>
                    <span class="label">Import</span>
                </button>
                <button id="btn-export-json" class="toolbar-btn" title="Export JSON">
                    <span class="icon">📤</span>
                    <span class="label">Export</span>
                </button>
                <button id="btn-load-template" class="toolbar-btn" title="Load AI Template">
                    <span class="icon">📋</span>
                    <span class="label">תבנית</span>
                </button>
                <button id="btn-ai-analyze" class="toolbar-btn" title="Analyze PDF with AI">
                    <span class="icon">🤖</span>
                    <span class="label">AI</span>
                </button>
            </div>

            <div class="toolbar-separator"></div>

            <div class="toolbar-group tools" data-mapper-only>
                <button id="btn-tool-select" class="toolbar-btn tool-btn active" data-tool="select" title="Select (V)">
                    <span class="icon">👆</span>
                </button>
                <button id="btn-tool-capture" class="toolbar-btn tool-btn" data-tool="capture_name" title="Capture Field Name (N)">
                    <span class="icon">🎯</span>
                </button>
                <button id="btn-tool-text" class="toolbar-btn tool-btn" data-tool="draw_text" title="Draw Text Field (T)">
                    <span class="icon">📝</span>
                </button>
                <button id="btn-tool-checkbox" class="toolbar-btn tool-btn" data-tool="draw_checkbox" title="Draw Checkbox (C)">
                    <span class="icon">☑️</span>
                </button>
                <button id="btn-tool-radio" class="toolbar-btn tool-btn" data-tool="draw_radio" title="Draw Radio (R)">
                    <span class="icon">🔘</span>
                </button>
                <button id="btn-tool-cell" class="toolbar-btn tool-btn" data-tool="draw_cell" title="תא סימון (M)">
                    <span class="icon">▢</span>
                </button>
                <button id="btn-tool-table" class="toolbar-btn tool-btn" data-tool="draw_table" title="Draw Table">
                    <span class="icon">📊</span>
                </button>
            </div>

            <div class="toolbar-separator" data-mapper-only></div>

            <div class="toolbar-group" data-mapper-only>
                <button id="btn-undo" class="toolbar-btn" title="Undo (Ctrl+Z)" disabled>
                    <span class="icon">↩️</span>
                </button>
                <button id="btn-redo" class="toolbar-btn" title="Redo (Ctrl+Y)" disabled>
                    <span class="icon">↪️</span>
                </button>
            </div>

            <div class="toolbar-separator" data-mapper-only></div>

            <div class="toolbar-group page-nav">
                <button id="btn-prev-page" class="toolbar-btn" title="Previous Page" disabled>
                    <span class="icon">◀</span>
                </button>
                <span id="page-indicator" class="page-indicator">1 / 1</span>
                <button id="btn-next-page" class="toolbar-btn" title="Next Page" disabled>
                    <span class="icon">▶</span>
                </button>
            </div>

            <div class="toolbar-separator"></div>

            <div class="toolbar-group zoom-controls">
                <button id="btn-zoom-out" class="toolbar-btn" title="Zoom Out (Ctrl+-)">
                    <span class="icon">➖</span>
                </button>
                <span id="zoom-info" class="zoom-indicator">100%</span>
                <button id="btn-zoom-in" class="toolbar-btn" title="Zoom In (Ctrl++)">
                    <span class="icon">➕</span>
                </button>
                <button id="btn-zoom-fit" class="toolbar-btn" title="Fit to Window">
                    <span class="icon">⛶</span>
                </button>
                <button id="btn-zoom-reset" class="toolbar-btn" title="Reset Zoom (Ctrl+0)">
                    <span class="icon">↺</span>
                </button>
            </div>

            <!-- V3.2: Draft Fields Indicator -->
            <div id="draft-indicator" class="toolbar-group draft-indicator hidden" data-mapper-only>
                <span class="draft-badge">🟡 <span id="draft-count">0</span> שדות טיוטה</span>
                <button id="btn-review" class="toolbar-btn review-btn" title="Review Fields (Shift+R)">
                    Review
                </button>
            </div>

            <!-- V3.9: Auto-Advance Indicator -->
            <div id="auto-advance-indicator" class="toolbar-group auto-advance-indicator" data-mapper-only>
                <button id="btn-auto-advance" class="toolbar-btn auto-advance-btn active" title="מעבר אוטומטי (A)">
                    <span class="icon">⏭️</span>
                    <span class="label">אוטומטי</span>
                </button>
                <span id="remaining-count" class="remaining-badge hidden">0</span>
            </div>

            <!-- V3.10: Flow Mode Toggle (Mapping / Quick Fill) -->
            <div id="flow-mode-toggle" class="toolbar-group flow-mode-toggle" data-mapper-only>
                <!-- V3.10: Flow mode switcher hidden - QuickFill moved to separate site (?mode=quickfill) -->
                <div class="flow-mode-switcher" style="display: none;">
                    <button id="btn-mode-mapping" class="flow-mode-btn active" data-mode="mapping" title="מיפוי רגיל">
                        <span class="icon">📍</span>
                        <span class="label">מיפוי</span>
                    </button>
                    <button id="btn-mode-quickfill" class="flow-mode-btn" data-mode="quick_fill" title="מילוי מהיר">
                        <span class="icon">⚡</span>
                        <span class="label">מילוי מהיר</span>
                    </button>
                </div>
            </div>

            <!-- V3.11: Static QuickFill toolbar (shown in QuickFill mode) -->
            <div id="qf-static-toolbar" class="toolbar-group quick-fill-tools hidden">
                <button class="toolbar-btn qf-tool-btn active" data-tool="draw_text" title="מילוי טקסט">
                    <span class="icon">📝</span>
                    <span class="qf-text"><span class="qf-title">טקסט</span></span>
                </button>
                <button class="toolbar-btn qf-tool-btn" data-tool="draw_checkbox" title="סימון ✓">
                    <span class="icon">☑️</span>
                    <span class="qf-text"><span class="qf-title">סימון</span></span>
                </button>
                <button class="toolbar-btn qf-tool-btn" data-tool="draw_radio" title="בחירה ●">
                    <span class="icon">🔘</span>
                    <span class="qf-text"><span class="qf-title">בחירה</span></span>
                </button>
                <button class="toolbar-btn qf-tool-btn" data-tool="draw_signature" title="חתימה">
                    <span class="icon">✍️</span>
                    <span class="qf-text"><span class="qf-title">חתימה</span></span>
                </button>
            </div>
            <div class="toolbar-separator quick-fill-tools hidden"></div>
            <div id="qf-static-actions" class="toolbar-group quick-fill-tools hidden">
                <span class="qf-box-count">0 שדות</span>
                <button class="toolbar-btn load-json-btn" title="טען מיפוי">
                    <span class="icon">📋</span>
                    <span class="qf-text"><span class="qf-title">מיפוי</span></span>
                </button>
                <button class="toolbar-btn export-pdf-btn" title="הורד PDF">
                    <span class="icon">⬇️</span>
                    <span class="qf-text"><span class="qf-title">הורד</span></span>
                </button>
                <button class="toolbar-btn clear-all-btn" title="נקה הכל">
                    <span class="icon">🗑️</span>
                    <span class="qf-text"><span class="qf-title">נקה</span></span>
                </button>
                <button class="toolbar-btn advanced-mode-btn" title="מצב מתקדם">
                    <span class="icon">🔧</span>
                    <span class="qf-text"><span class="qf-title">מתקדם</span></span>
                </button>
            </div>
            <div class="toolbar-spacer"></div>

            <div class="toolbar-group">
                <span id="status-indicator" class="status-indicator">Ready</span>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Sidebar -->
            <aside id="sidebar-container" class="sidebar">
                <div class="sidebar-header">
                    <h2>Fields</h2>
                    <div class="sidebar-controls">
                        <input type="text" id="field-search" class="field-search" placeholder="Search...">
                    </div>
                </div>
                <div id="field-list" class="field-list">
                    <p class="empty-message">No fields yet. Load a PDF to start mapping.</p>
                </div>
            </aside>

            <!-- PDF Viewer - EXACT structure from legacy mapper -->
            <section id="pdf-section" class="canvas-area">
                <div id="canvas-viewport" class="canvas-viewport">
                    <!-- V3.11: PDF Drop Zone - shown when no PDF is loaded -->
                    <div id="pdf-drop-zone" class="pdf-drop-zone">
                        <div class="drop-zone-content">
                            <div class="drop-zone-icon">
                                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                    <polyline points="14 2 14 8 20 8"/>
                                    <line x1="12" y1="18" x2="12" y2="12"/>
                                    <line x1="9" y1="15" x2="15" y2="15"/>
                                </svg>
                            </div>
                            <h2 class="drop-zone-title">טען קובץ PDF</h2>
                            <p class="drop-zone-subtitle">גרור לכאן או לחץ לבחירה</p>
                            <div class="drop-zone-hint">תומך בקבצי PDF בלבד</div>
                        </div>
                    </div>
                    <div id="transform-container" class="transform-container">
                        <div id="canvas-container" class="canvas-container">
                            <!-- PDF Container - holds the <img> element (PNG of PDF) -->
                            <div id="pdf-container"></div>

                            <!-- Overlay Layer (for field rectangles) - EXACT from legacy mapping-layer -->
                            <div id="overlay-layer" class="overlay-layer"></div>

                            <!-- Drawing Preview Layer -->
                            <div id="drawing-layer" class="drawing-layer"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Properties Panel -->
            <aside id="properties-panel" class="properties-panel hidden">
                <div class="panel-header">
                    <h3>Field Properties</h3>
                    <button id="btn-close-properties" class="btn-close">×</button>
                </div>
                <div id="properties-content" class="properties-content">
                    <!-- Dynamically filled -->
                </div>
            </aside>
        </main>
    </div>

    <!-- Hidden file inputs -->
    <input type="file" id="pdf-file-input" accept=".pdf" hidden>
    <input type="file" id="json-file-input" accept=".json" hidden>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Context Menu -->
    <div id="context-menu" class="context-menu hidden">
        <button data-action="edit">Edit</button>
        <button data-action="duplicate">Duplicate</button>
        <button data-action="delete">Delete</button>
    </div>

    <!-- Table Flow Panel (minimal UI) -->
    <div id="table-flow-panel" class="table-flow-panel hidden">
        <div class="table-flow-header">
            <h3 id="table-flow-title">מיפוי טבלה</h3>
            <button id="table-flow-cancel" class="btn-close">×</button>
        </div>
        <div class="table-flow-content">
            <div id="table-flow-step-info" class="step-info">
                <span id="table-flow-step-num">שלב 1/6</span>
                <span id="table-flow-step-desc">סמן את אזור הכותרת</span>
            </div>
            <div id="table-flow-message" class="flow-message"></div>
            <div id="table-flow-row-count" class="row-count-input hidden">
                <label>מספר שורות:</label>
                <input type="number" id="table-row-count-input" min="1" max="100" placeholder="הזן מספר">
            </div>
            <div id="table-flow-columns" class="columns-list hidden">
                <h4>עמודות:</h4>
                <ul id="table-columns-list"></ul>
                <button id="table-autobox-btn" class="btn-autobox hidden" title="חלק את השורה לעמודות שוות">
                    📐 חלוקה אוטומטית
                </button>
            </div>
            <div id="table-flow-summary" class="flow-summary hidden"></div>
        </div>
        <div class="table-flow-actions">
            <button id="table-flow-back" class="btn-secondary" disabled>הקודם</button>
            <button id="table-flow-next" class="btn-primary" disabled>הבא</button>
        </div>
    </div>

    <!-- Column Details Dialog (for table) -->
    <div id="column-details-dialog" class="dialog-overlay hidden">
        <div class="dialog-box">
            <h3>פרטי עמודה</h3>
            <div class="form-group">
                <label>שם העמודה:</label>
                <input type="text" id="column-name-input" placeholder="לדוגמא: שם פרטי">
            </div>
            <div class="form-group">
                <label>סוג שדה:</label>
                <select id="column-type-select">
                    <option value="text">טקסט</option>
                    <option value="number">מספר</option>
                    <option value="date">תאריך</option>
                    <option value="checkbox">תיבת סימון</option>
                </select>
            </div>
            <div class="form-group">
                <label>מצב תצוגה:</label>
                <div class="layout-toggle-buttons" id="column-layout-toggle">
                    <button type="button" class="layout-toggle active" data-mode="flow">זרימה</button>
                    <button type="button" class="layout-toggle" data-mode="slots">תיבות</button>
                </div>
            </div>
            <div class="form-group slot-count-group hidden" id="column-slot-count-group">
                <label>מספר תיבות:</label>
                <div class="slot-count-control">
                    <button type="button" class="slot-adjust" data-delta="-1">−</button>
                    <input type="number" id="column-slot-count" value="9" min="1" max="30">
                    <button type="button" class="slot-adjust" data-delta="1">+</button>
                </div>
            </div>
            <div class="dialog-actions">
                <button id="column-cancel-btn" class="btn-secondary">ביטול</button>
                <button id="column-confirm-btn" class="btn-primary">אישור</button>
            </div>
        </div>
    </div>

    <!-- Smart Table Detection Dialog -->
    <div id="smart-table-dialog" class="dialog-overlay hidden">
        <div class="dialog-box smart-table-dialog">
            <h3>זוהתה טבלה פוטנציאלית</h3>
            <p id="smart-table-description" class="dialog-description"></p>

            <div id="smart-table-columns" class="smart-table-columns">
                <!-- Column list will be populated dynamically -->
            </div>

            <div class="dialog-actions">
                <button id="smart-table-skip" class="btn-secondary">השאר כשדות רגילים</button>
                <button id="smart-table-convert" class="btn-primary">המר לטבלה</button>
            </div>

            <div id="smart-table-nav" class="smart-table-nav hidden">
                <span id="smart-table-counter">1 / 1</span>
            </div>
        </div>
    </div>

    <!-- V3.9: Recent PDFs localStorage manager -->
    <script src="./core/RecentPDFs.js"></script>

    <!-- V3.9: Welcome Screen component -->
    <script src="./ui/WelcomeScreen.js"></script>

    <!-- V3.9: Field Loader Screen component -->
    <script src="./ui/FieldLoaderScreen.js"></script>

    <!-- Intent Resolver for renderHint in export -->
    <script src="./shared/FieldIntentResolver.js"></script>

    <!-- Layout Helper - Safe accessors for field layout (Phase 3) -->
    <script src="./shared/LayoutHelper.js"></script>

    <!-- V3.11: Scaffold Avoidance - Pixel-based detection for date lines/grids -->
    <script src="../shared/ScaffoldAvoidance.js"></script>
    <script>
        // Feature flags
        window.FEATURES = window.FEATURES || {};
        window.FEATURES.SCAFFOLD_AVOIDANCE = true;  // V3.11: Kill switch for scaffold avoidance
    </script>

    <!-- V3.10: PreviewTextRenderer from LiveFill - for Quick Fill mode text rendering -->
    <script src="../livefill/js/preview-text-renderer.js"></script>

    <!-- V3.10: PDF-LIB for Quick Fill PDF export -->
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <!-- V3.10: fontkit for Hebrew font embedding (required by pdf-lib for custom fonts) -->
    <script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.0.0"></script>

    <!-- רישום fontkit ל-pdf-lib (חובה לעברית) - copied exactly from livefill.html -->
    <script>
        PDFLib.PDFDocument.prototype.registerFontkit = function (fontkit) {
            this.fontkit = fontkit;
        };
        PDFLib.PDFDocument.registerFontkit = function (fontkit) {
            PDFLib.PDFDocument.prototype.fontkit = fontkit;
        };
        PDFLib.PDFDocument.registerFontkit(fontkit);
    </script>

    <!-- V3.10: Dependencies for ExportEngine -->
    <script src="../shared/normalizeField.js"></script>

    <!-- V3.10: Progress modal stubs for ExportEngine (it checks typeof before calling) -->
    <script>
        // Simple progress modal for Quick Fill export
        window.showProgressModal = function() {
            const existing = document.getElementById('qf-progress-modal');
            if (existing) existing.remove();

            const modal = document.createElement('div');
            modal.id = 'qf-progress-modal';
            modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:10000;';
            modal.innerHTML = `
                <div style="background:white;padding:24px 32px;border-radius:8px;text-align:center;direction:rtl;">
                    <div id="qf-progress-text" style="margin-bottom:12px;font-size:16px;">מייצא PDF...</div>
                    <div style="width:200px;height:6px;background:#e0e0e0;border-radius:3px;overflow:hidden;">
                        <div id="qf-progress-bar" style="width:0%;height:100%;background:#4CAF50;transition:width 0.3s;"></div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        };

        window.hideProgressModal = function() {
            const modal = document.getElementById('qf-progress-modal');
            if (modal) modal.remove();
        };

        window.updateProgress = function(percent, message) {
            const bar = document.getElementById('qf-progress-bar');
            const text = document.getElementById('qf-progress-text');
            if (bar) bar.style.width = percent + '%';
            if (text && message) text.textContent = message;
        };
    </script>

    <!-- V3.10: ExportEngine from LiveFill - for Quick Fill PDF export -->
    <script src="../livefill/js/export-engine.js"></script>

    <!-- Application Bootstrap -->
    <script type="module">
        // Import core modules
        import { mapper } from './core/MapperCore.js';
        import { state, Tools, Modes, FlowModes } from './core/StateManager.js';
        import { eventBus, Events } from './core/EventBus.js';
        import { intentManager, IntentType, IntentSource } from './core/IntentManager.js';

        // Import engines
        import { pdfEngine } from './engines/PDFEngine.js';
        import { overlayRenderer } from './engines/OverlayRenderer.js';
        import { dragController } from './engines/DragController.js';
        import { drawController } from './engines/DrawController.js';
        import { viewportController } from './engines/ViewportController.js';

        // Import UI
        import { sidebarController } from './ui/SidebarController.js';
        import { nameConfirmDialog } from './ui/NameConfirmDialog.js';
        import { radioGroupDialog } from './ui/RadioGroupDialog.js';
        // V3.10: Legacy table system disabled - using new TableRegion
        // import { tableFlowUI } from './ui/TableFlowUI.js';
        import { templateImportDialog } from './ui/TemplateImportDialog.js';
        import { exceptionReviewPanel } from './ui/ExceptionReviewPanel.js';
        import { entityMappingModeDialog } from './ui/EntityMappingModeDialog.js';
        import { aiAnalysisDialog } from './ui/AIAnalysisDialog.js';
        import { guidedMappingUI } from './ui/GuidedMappingUI.js';
        import { fieldIntelligenceStore } from './core/FieldIntelligenceStore.js';

        // Import overlay modules
        import { labelOverlay } from './overlay/LabelOverlay.js';

        // Import word selector (new word-based selection) - gated for QuickFill
        let wordSelector = null;

        // Import text extraction (for name capture)
        import { textExtractor } from './engines/TextExtractor.js';
        import { fieldNamer } from './engines/FieldNamer.js';

        // V3.10: Legacy table toolbar mode disabled - using new TableRegion
        // import { tableToolbarMode } from './ui/TableToolbarMode.js';
        const tableToolbarMode = null; // Stub for backward compatibility

        // V3.9: Import AutoAdvanceController for field-driven workflow
        import { autoAdvanceController } from './ui/AutoAdvanceController.js';

        // V3.9: Import DuplicateFieldDialog for "Duplicate × N"
        import { duplicateFieldDialog } from './ui/DuplicateFieldDialog.js';

        // V3.10: Import QuickFillOverlay for Quick Fill mode
        import { quickFillOverlay } from './ui/QuickFillOverlay.js';

        // V3.10: Import MappingLoader for loading JSON mappings into QuickFill
        import { mappingLoader } from './ui/MappingLoader.js';

        // V3.10: Import QuickFillUIProfile for public mode UI
        import { quickFillUIProfile } from './ui/QuickFillUIProfile.js';

        // V3.10: Import new TableRegion system
        import { tableRegionManager } from './core/TableRegionManager.js';
        import { tableSelectMode } from './ui/TableSelectMode.js';

        // Make available globally for debugging
        window.mapper = mapper;
        window.state = state;
        window.eventBus = eventBus;
        window.Events = Events;
        window.Tools = Tools;
        window.Modes = Modes;
        window.pdfEngine = pdfEngine;
        window.overlayRenderer = overlayRenderer;
        window.viewportController = viewportController;
        window.drawController = drawController;
        // V3.10: Legacy table system disabled
        // window.tableFlowUI = tableFlowUI;
        // V3.10: New TableRegion system
        window.tableRegionManager = tableRegionManager;
        window.tableSelectMode = tableSelectMode;
        window.labelOverlay = labelOverlay;
        const urlParams = new URLSearchParams(window.location.search);
        const modeParam = urlParams.get('mode');
        const isQuickFillMode = modeParam === 'quickfill' || modeParam === 'quick_fill' || modeParam === 'quick-fill';
        if (!isQuickFillMode) {
            import('./engines/WordSelector.js').then((module) => {
                wordSelector = module.wordSelector;
                window.wordSelector = wordSelector;
            }).catch((err) => {
                console.error('[Mapper] Failed to load WordSelector:', err);
            });
        } else {

        /**
         * V3.9: Initialize Welcome Screens
         * Shows the new welcome flow instead of the old empty mapper view
         */
        function initWelcomeScreens() {
            const welcomeContainer = document.getElementById('welcome-screen-container');
            const fieldLoaderContainer = document.getElementById('field-loader-screen-container');
            const mapperContainer = document.getElementById('mapper-container');

            if (!welcomeContainer || !fieldLoaderContainer) {
                console.warn('[WelcomeScreens] Containers not found - skipping new UX flow');
                return;
            }

            // Initialize WelcomeScreen with callback for PDF selection
            // V3.10: Accept pdfArrayBuffer for Quick Fill export support
            WelcomeScreen.init(welcomeContainer, (file, pdfDoc, pdfArrayBuffer) => {
                console.log('[WelcomeScreens] PDF selected:', file.name);

                // Hide welcome screen, show field loader
                WelcomeScreen.hide();
                FieldLoaderScreen.show(file, pdfDoc, pdfArrayBuffer);
            });

            // Initialize FieldLoaderScreen with callback for fields loaded
            FieldLoaderScreen.init(fieldLoaderContainer, async (result) => {
                console.log('[WelcomeScreens] Fields loaded via:', result.method);

                // Hide field loader, show main mapper
                FieldLoaderScreen.hide();
                mapperContainer.style.display = '';

                // Load the PDF into the existing pdfEngine
                // The PDF is already loaded by WelcomeScreen, just need to render it
                try {
                    // Use the already-loaded pdfDoc
                    // V3.10: Pass pdfArrayBuffer for Quick Fill export support
                    await pdfEngine.loadFromDoc(result.pdfDoc, result.pdfFile.name, result.pdfArrayBuffer);

                    // If fields were provided, import them
                    if (result.fields && result.fields.length > 0) {
                        // Convert to unified format and import
                        // V3.9: Preserve original label_he/label_en from JSON
                        const unifiedData = {
                            $schema: 'unified-import-v1',
                            meta: {
                                source: 'welcome-screen',
                                version: '1.0',
                                loadMethod: result.method
                            },
                            fields: result.fields.map(f => ({
                                id: f.id || `field_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
                                label_he: f.label_he || f.labelHe || f.name,
                                label_en: f.label_en || f.labelEn || f.name,
                                type: f.type || 'text',
                                status: f.status || 'pending',
                                // Preserve any existing bbox or other properties
                                ...(f.bbox && { bbox: f.bbox }),
                                ...(f.page && { page: f.page })
                            }))
                        };
                        state.importUnifiedJson(unifiedData);
                        showToast(`נטענו ${result.fields.length} שדות`, 'success');
                    } else if (result.method === 'ocr') {
                        showToast('מצב OCR - סמן את אזור הסרגל לחילוץ שמות', 'info', { duration: 5000 });
                    } else if (result.method === 'manual') {
                        showToast('מצב ידני - הוסף שדות תוך כדי מיפוי', 'info', { duration: 5000 });
                    }
                } catch (error) {
                    console.error('[WelcomeScreens] Failed to load PDF into engine:', error);
                    showToast('שגיאה בטעינת ה-PDF', 'error');
                }
            });

            // Initially hide the main mapper and show welcome screen
            mapperContainer.style.display = 'none';
            WelcomeScreen.show();

            console.log('[WelcomeScreens] Initialized - showing welcome screen');
        }

        /**
         * Setup toolbar button handlers
         */
        function setupToolbar() {
            // Tool buttons
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tool = btn.dataset.tool;
                    const inQuickFill = state.isQuickFillMode();

                    // V3.10: Block non-drawing tools in Quick Fill mode
                    if (inQuickFill && (tool === 'select' || tool === 'capture_name' || tool === 'draw_table')) {
                        console.log('[Toolbar] Tool blocked in Quick Fill mode:', tool);
                        return;
                    }

                    // Special handling for Capture Name tool - uses click-select
                    if (tool === 'capture_name') {
                        console.log('[Toolbar] Capture Name button clicked - starting click-select');
                        drawController.startFieldNameCapture();
                        return;
                    }

                    // Special handling for Radio tool - starts the radio group flow (only in mapping mode)
                    if (tool === 'draw_radio') {
                        if (state.isQuickFillMode()) {
                            // In Quick Fill mode, just set the tool directly
                            console.log('[Toolbar] Radio button clicked - Quick Fill mode, setting tool');
                            state.setTool(tool);
                        } else {
                            console.log('[Toolbar] Radio button clicked - starting radio group flow');
                            drawController.startRadioGroupFlow();
                        }
                        return;
                    }

                    // Special handling for Checkbox tool - starts the checkbox group flow (only in mapping mode)
                    if (tool === 'draw_checkbox') {
                        if (state.isQuickFillMode()) {
                            // In Quick Fill mode, just set the tool directly
                            console.log('[Toolbar] Checkbox button clicked - Quick Fill mode, setting tool');
                            state.setTool(tool);
                        } else {
                            console.log('[Toolbar] Checkbox button clicked - starting checkbox group flow');
                            drawController.startCheckboxGroupFlow();
                        }
                        return;
                    }

                    // V3.10: Table tool - new TableRegion system
                    if (tool === 'draw_table') {
                        console.log('[Toolbar] Table button clicked - starting Table Select Mode');
                        // Import and use new TableSelectMode
                        if (window.tableSelectMode) {
                            window.tableSelectMode.start();
                        } else {
                            eventBus.emit(Events.TOAST_SHOW, {
                                message: 'צייר מלבן סביב הטבלה',
                                type: 'info',
                                duration: 3000
                            });
                            state.setTool('draw_table');
                        }
                        return;
                    }

                    state.setTool(tool);
                });
            });

            // Listen for tool changes to update UI
            eventBus.on(Events.TOOL_CHANGED, ({ tool }) => {
                document.querySelectorAll('.tool-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.tool === tool);
                });

            // Undo/Redo buttons (blocked in Quick Fill mode)

                if (!state.isQuickFillMode()) mapper.undo();

            document.getElementById('btn-redo').addEventListener('click', () => {
                if (!state.isQuickFillMode()) mapper.redo();
            });

            // Update undo/redo button state
            eventBus.on(Events.STATE_CHANGED, () => {
                const inQuickFill = state.isQuickFillMode();
                document.getElementById('btn-undo').disabled = inQuickFill || !state.canUndo();
                document.getElementById('btn-redo').disabled = inQuickFill || !state.canRedo();
            });

            // V3.10: Disable buttons when entering/exiting Quick Fill mode
            eventBus.on(Events.QUICK_FILL_MODE_CHANGED, ({ active }) => {
                document.getElementById('btn-undo').disabled = active || !state.canUndo();
                document.getElementById('btn-redo').disabled = active || !state.canRedo();

                // Disable non-drawing tools visually
                ['btn-tool-select', 'btn-tool-capture', 'btn-tool-table'].forEach(id => {
                    const btn = document.getElementById(id);
                    if (btn) btn.disabled = active;
                });

            // V3.2: Toast event listener with action support
            eventBus.on(Events.TOAST_SHOW, (data) => {
                const options = {};
                if (data.duration) options.duration = data.duration;
                if (data.action) options.action = data.action;
                showToast(data.message, data.type || 'info', options);
            });

            // Page navigation
            document.getElementById('btn-prev-page').addEventListener('click', async () => {
                await pdfEngine.prevPage();

            document.getElementById('btn-next-page').addEventListener('click', async () => {
                await pdfEngine.nextPage();

            // Zoom controls

                viewportController.zoomOut();

            document.getElementById('btn-zoom-fit').addEventListener('click', () => {
                viewportController.fitToViewport();
            });

            document.getElementById('btn-zoom-reset').addEventListener('click', () => {
                viewportController.resetZoom();
            });

            // V3.9: Auto-advance toggle button
            const autoAdvanceBtn = document.getElementById('btn-auto-advance');
            if (autoAdvanceBtn) {
                autoAdvanceBtn.addEventListener('click', () => {
                    const enabled = autoAdvanceController.toggle();
                    autoAdvanceBtn.classList.toggle('active', enabled);
                });
            }

            // V3.10: Flow mode toggle buttons (Mapping / Quick Fill)
            const flowModeButtons = document.querySelectorAll('.flow-mode-btn');
            flowModeButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // V3.11: Only handle real user clicks

                    const mode = btn.dataset.mode;

                    // Set flow mode in state
                    if (mode === 'mapping') {
                        state.setFlowMode(FlowModes.MAPPING);
                    } else if (mode === 'quick_fill') {
                        state.setFlowMode(FlowModes.QUICK_FILL);
                    }

                    // Update button states

                        b.classList.toggle('active', b.dataset.mode === mode);
                    });

            // Listen for flow mode changes from other sources

                flowModeButtons.forEach(btn => {

                // V3.11: Load WordSelector on-demand when switching to Mapping mode

                    console.log('[Mapper] Loading WordSelector for Mapping mode...');
                    import('./engines/WordSelector.js').then((module) => {
                        wordSelector = module.wordSelector;
                        window.wordSelector = wordSelector;
                        if (wordSelector && typeof wordSelector.init === 'function') {
                            wordSelector.init();

                        console.log('[Mapper] WordSelector loaded dynamically');

            // Update remaining count when fields change
            eventBus.on(Events.STATE_CHANGED, () => {

            });

            function updateRemainingCount() {
                const remainingEl = document.getElementById('remaining-count');
                if (remainingEl) {
                    const count = autoAdvanceController.getRemainingCount();
                    remainingEl.textContent = count;
                    remainingEl.classList.toggle('hidden', count === 0);
                }
            }

            // Open PDF button
            document.getElementById('btn-open-pdf').addEventListener('click', () => {
                document.getElementById('pdf-file-input').click();
            });

            // Import JSON button
            document.getElementById('btn-import-json').addEventListener('click', () => {
                document.getElementById('json-file-input').click();
            });

            // Load Template button - opens AI template import dialog
            document.getElementById('btn-load-template').addEventListener('click', () => {
                templateImportDialog.open();
            });

            // AI Analyze button - opens AI analysis dialog for automatic PDF analysis
            document.getElementById('btn-ai-analyze').addEventListener('click', () => {
                // Check if PDF is loaded first
                if (!pdfEngine.isLoaded()) {
                    showToast('נא לטעון PDF קודם', 'warning');
                    return;
                }
                aiAnalysisDialog.show();
            });

            // Export JSON button - exports mapped fields and tables
            document.getElementById('btn-export-json').addEventListener('click', () => {
                const data = mapper.exportMappedFields();

                // Check if export was blocked by validation
                if (!data) {
                    // Get validation details to show user
                    const validation = mapper.validateMapping();
                    if (validation.errors.length > 0) {
                        console.error('[Export] Validation errors:', validation.errors);
                        // Show detailed errors
                        const errorList = validation.errors.map(e =>
                            `• ${e.fieldLabel || e.fieldId || 'Unknown'}: ${e.message}`
                        ).join('\n');
                        alert(`לא ניתן לייצא - יש ${validation.errors.length} שגיאות:\n\n${errorList}`);
                    }
                    return;
                }

                // Check if there are any mapped fields OR tables
                const hasFields = data.fields && data.fields.length > 0;
                const hasTables = data.tables && data.tables.length > 0;

                if (!hasFields && !hasTables) {
                    showToast('No mapped fields or tables to export. Map some data first!', 'warning');
                    return;
                }

                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${state.get('document.fileName') || 'project'}_mapping.json`;
                a.click();
                URL.revokeObjectURL(url);

                // Build export message
                const parts = [];
                if (hasFields) parts.push(`${data.fields.length} fields`);
                if (hasTables) parts.push(`${data.tables.length} tables`);
                showToast(`Exported ${parts.join(' + ')}`, 'success');
            });

        }

        /**
         * V3.11: Setup PDF drop zone with drag & drop support
         */
        function setupPdfDropZone() {
            const dropZone = document.getElementById('pdf-drop-zone');
            const fileInput = document.getElementById('pdf-file-input');
            if (!dropZone || !fileInput) return;

            // Click to open file picker
            dropZone.addEventListener('click', () => {
                fileInput.click();
            });

            // Drag enter - show visual feedback
            dropZone.addEventListener('dragenter', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('drag-over');
            });

            // Drag over - required for drop to work
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('drag-over');
            });

            // Drag leave - remove visual feedback
            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                e.stopPropagation();
                // Only remove if leaving the drop zone entirely
                if (!dropZone.contains(e.relatedTarget)) {
                    dropZone.classList.remove('drag-over');
                }
            });

            // Drop - handle the file
            dropZone.addEventListener('drop', async (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('drag-over');

                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    const file = files[0];
                    if (file.type === 'application/pdf' || file.name.endsWith('.pdf')) {
                        try {
                            await pdfEngine.load(file);
                            showToast('PDF נטען בהצלחה', 'success');
                        } catch (error) {
                            console.error('Failed to load PDF:', error);
                            showToast('שגיאה בטעינת PDF: ' + error.message, 'error');
                        }
                    } else {
                        showToast('נא לבחור קובץ PDF בלבד', 'warning');
                    }
                }
            });

            // Hide drop zone when PDF is loaded
            eventBus.on(Events.PDF_LOADED, () => {
                dropZone.classList.add('hidden');
            });

            console.log('[Mapper] PDF drop zone initialized');
        }

        /**
         * Setup file input handlers
         */
        function setupFileInputs() {
            // PDF file input
            document.getElementById('pdf-file-input').addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (file) {
                    try {
                        await pdfEngine.load(file);
                        showToast('PDF loaded successfully', 'success');
                    } catch (error) {
                        console.error('Failed to load PDF:', error);
                        showToast('Failed to load PDF: ' + error.message, 'error');
                    }
                }
                e.target.value = ''; // Reset for re-selection
            });

            // V3.11: Setup PDF drop zone
            setupPdfDropZone();

            // JSON file input - supports Mapper JSON and Unified Schema (AI templates)
            document.getElementById('json-file-input').addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (file) {
                    try {
                        const text = await file.text();
                        const data = JSON.parse(text);

                        // Detect format and route to appropriate import
                        // Unified Import Schema v1 (AI-prepared templates)
                        if (data.$schema === 'unified-import-v1' || (data.meta?.source && data.fields) || (data.meta?.version && data.fields)) {
                            console.log('[Import] Detected Unified Import Schema');
                            state.importUnifiedJson(data);
                            const stats = `${data.fields?.length || 0} שדות`;
                            const groups = data.groups?.length ? `, ${data.groups.length} קבוצות` : '';
                            showToast(`יובאו ${stats}${groups}`, 'success');
                        } else {
                            // Standard Mapper JSON format (legacy)
                            mapper.importProject(data);
                            showToast('Project imported', 'success');
                        }

                        // V3.11: If in QuickFill mode, convert imported fields to QuickFill boxes
                        const isQuickFillMode = state.get('flowMode') === FlowModes.QUICK_FILL;
                        if (isQuickFillMode && quickFillOverlay) {
                            // Small delay to ensure fields are fully imported
                            setTimeout(() => {
                                const count = quickFillOverlay.importFromFields();
                                if (count === -1) {
                                    // PDF not loaded yet - mark as pending for auto-import when PDF loads
                                    quickFillOverlay._pendingImportFromFields = true;
                                    showToast('המיפוי נשמר - יטען אוטומטית כשתטען PDF', 'info');
                                } else if (count > 0) {
                                    showToast(`נטענו ${count} שדות למילוי`, 'success');
                                } else {
                                    showToast('לא נמצאו שדות ממופים בקובץ', 'warning');
                                }
                            }, 100);
                        }
                    } catch (error) {
                        console.error('Failed to import JSON:', error);
                        showToast('Failed to import: ' + error.message, 'error');
                    }
                }
                e.target.value = '';
            });
        }

         */
        function setupStaticQuickFillToolbar() {

                    btn.classList.add('active');

                    quickFillOverlay.clearAll();
                }

        /**
         * Show toast notification
         * V3.2: Extended to support action button
         * V3.11: Filter irrelevant toasts in QuickFill mode
         * @param {string} message - Toast message
         * @param {string} type - Toast type (info, success, warning, error)
         * @param {Object} options - Optional { duration, action: { label, callback } }
         */
        function showToast(message, type = 'info', options = {}) {
            // V3.11: In QuickFill mode, only show critical toasts (PDF, export, errors)
            if (document.body.classList.contains('quick-fill-mode')) {
                const allowedPatterns = ['PDF', 'יוצא', 'שגיאה', 'נטען', 'error', 'success', 'הורד'];
                const isAllowed = type === 'error' || type === 'success' ||
                                  allowedPatterns.some(p => message.includes(p));
                if (!isAllowed) {
                    console.log('[Toast] Filtered in QuickFill mode:', message);
                    return; // Block irrelevant toasts
                }
            }

            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;

            // V3.2: Support action button
            if (options.action && options.action.label && options.action.callback) {
                const textSpan = document.createElement('span');
                textSpan.textContent = message;
                toast.appendChild(textSpan);

                const actionBtn = document.createElement('button');
                actionBtn.className = 'toast-action-btn';
                actionBtn.textContent = options.action.label;
                actionBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    options.action.callback();
                    toast.remove();
                });
                toast.appendChild(actionBtn);
            } else {
                toast.textContent = message;
            }

            container.appendChild(toast);

            const duration = options.duration || 3000;
            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // Expose showToast globally
        window.showToast = showToast;

        /**
         * Setup context menu
         */
        function setupContextMenu() {
            const menu = document.getElementById('context-menu');
            if (!menu) return;

            menu.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const action = btn.dataset.action;
                    const fieldId = menu.dataset.fieldId;

                    if (!fieldId) return;

                    switch (action) {
                        case 'edit':
                            // Show properties panel
                            document.getElementById('properties-panel').classList.remove('hidden');
                            break;
                        case 'duplicate':
                            const field = state.getField(fieldId);
                            if (field) {
                                const newField = state.addField({
                                    ...field,
                                    id: undefined,
                                    bbox: field.bbox ? [
                                        field.bbox[0] + 0.02,
                                        field.bbox[1] + 0.02,
                                        field.bbox[2],
                                        field.bbox[3]
                                    ] : null
                                });
                                showToast('Field duplicated', 'success');
                            }
                            break;
                        case 'delete':
                            state.deleteField(fieldId);
                            showToast('Field deleted', 'success');
                            break;
                    }

                    menu.classList.add('hidden');
                });
            });

            // Close properties panel
            document.getElementById('btn-close-properties')?.addEventListener('click', () => {
                document.getElementById('properties-panel').classList.add('hidden');
            });
        }

        /**
         * Setup Smart Table Detection dialog
         * Shows when repeating field patterns are detected after import
         */
        function setupSmartTableDialog() {
            const dialog = document.getElementById('smart-table-dialog');
            const description = document.getElementById('smart-table-description');
            const columnsContainer = document.getElementById('smart-table-columns');
            const convertBtn = document.getElementById('smart-table-convert');
            const skipBtn = document.getElementById('smart-table-skip');
            const navContainer = document.getElementById('smart-table-nav');
            const counter = document.getElementById('smart-table-counter');

            let candidates = [];
            let currentIndex = 0;

            // Listen for smart table detection event
            eventBus.on(Events.SMART_TABLE_DETECTED, ({ candidates: detected }) => {
                candidates = detected;
                currentIndex = 0;

                if (candidates.length === 0) return;

                console.log('[SmartTableDialog] Showing dialog for', candidates.length, 'candidates');
                showCandidate(currentIndex);
                dialog.classList.remove('hidden');
            });

            function showCandidate(index) {
                const candidate = candidates[index];
                if (!candidate) return;

                // Use Hebrew names for display (baseHe, columnsHe)
                const tableName = candidate.baseHe || candidate.base;
                const columnNames = candidate.columnsHe || candidate.columns;

                // Update description - use Hebrew base name
                description.innerHTML = `
                    זוהו <strong>${candidate.fieldIds.length}</strong> שדות שנראים כמו טבלה: <strong>"${tableName}"</strong><br>
                    <span class="table-stats">${candidate.columnCount} עמודות × ${candidate.rowCount} שורות</span>
                `;

                // Show columns with Hebrew names
                columnsContainer.innerHTML = `
                    <div class="columns-label">עמודות שזוהו:</div>
                    <div class="columns-list">
                        ${columnNames.map(col => `<span class="column-tag">${col}</span>`).join('')}
                    </div>
                    <div class="rows-label">שורות: ${candidate.rows.join(', ')}</div>
                    <div class="fields-preview">
                        <details>
                            <summary>שדות שיומרו (${candidate.fieldIds.length})</summary>
                            <ul class="fields-list">
                                ${candidate.fields.slice(0, 10).map(f =>
                                    `<li>${f.label_he || f.columnHe || f.label_en}</li>`
                                ).join('')}
                                ${candidate.fields.length > 10 ? `<li>... ועוד ${candidate.fields.length - 10}</li>` : ''}
                            </ul>
                        </details>
                    </div>
                `;

                // Update navigation
                if (candidates.length > 1) {
                    navContainer.classList.remove('hidden');
                    counter.textContent = `${index + 1} / ${candidates.length}`;
                } else {
                    navContainer.classList.add('hidden');
                }
            }

            // Convert button
            convertBtn.addEventListener('click', () => {
                const candidate = candidates[currentIndex];
                if (candidate) {
                    state.convertSmartTableToTable(candidate);
                }

                // Move to next or close
                currentIndex++;
                if (currentIndex < candidates.length) {
                    showCandidate(currentIndex);
                } else {
                    dialog.classList.add('hidden');
                    candidates = [];
                    currentIndex = 0;
                }
            });

            // Skip button
            skipBtn.addEventListener('click', () => {
                // Move to next or close
                currentIndex++;
                if (currentIndex < candidates.length) {
                    showCandidate(currentIndex);
                } else {
                    dialog.classList.add('hidden');
                    candidates = [];
                    currentIndex = 0;
                    showToast('שדות נשמרו כשדות רגילים', 'info');
                }
            });

            // Close on overlay click
            dialog.addEventListener('click', (e) => {
                if (e.target === dialog) {
                    dialog.classList.add('hidden');
                    candidates = [];
                    currentIndex = 0;
                }
            });
        }
    </script>
